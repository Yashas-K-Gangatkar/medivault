# MEDIVAULT — Docker Compose for production
# Usage:
#   docker compose up -d --build
# Then visit http://localhost:3000 (or your VPS IP)

services:
  medivault:
    build: .
    container_name: medivault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/medivault.db
      # Override PORT here if you want a different port
      - PORT=3000
    volumes:
      # Persistent database — your data survives container rebuilds
      - medivault_db:/app/db
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  medivault_db:
    driver: local
